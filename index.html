<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="合成大丑照">
<meta name="format-detection" content="telephone=no">
<title>合成大丑照</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23ffd166'/%3E%3Ccircle cx='34' cy='42' r='7' fill='%23222'/%3E%3Ccircle cx='66' cy='42' r='7' fill='%23222'/%3E%3Cpath d='M30 62 q20 24 40 0' stroke='%23222' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#0a0d16;
    --fg:#ffffff;
    --muted:rgba(255,255,255,.55);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:var(--ink);color:var(--fg);overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  #game{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;left:0;right:0;top:0;z-index:3;
    padding:calc(var(--safe-t) + 12px) 18px 0;
    display:flex;align-items:flex-start;justify-content:space-between;
    pointer-events:none;
  }
  .score{line-height:1}
  .score .lbl{font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:600}
  .score .val{
    font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:4px;
    text-shadow:0 2px 12px rgba(120,170,255,.35), 0 1px 0 rgba(0,0,0,.5);
    font-variant-numeric:tabular-nums;
    transition:transform .12s ease;
  }
  .score .val.pop{transform:scale(1.18)}
  .next{display:flex;flex-direction:column;align-items:center;gap:5px}
  .next .lbl{font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:600}
  .next img{
    width:52px;height:52px;border-radius:50%;object-fit:cover;
    border:2.5px solid rgba(255,255,255,.92);
    box-shadow:0 4px 16px rgba(0,0,0,.55);
    background:#1b2233;
  }
  #brand{
    position:fixed;left:0;right:0;top:calc(var(--safe-t) + 14px);z-index:4;
    display:flex;align-items:center;justify-content:center;gap:9px;
    font-size:12px;letter-spacing:.3em;font-weight:700;
    color:rgba(255,255,255,.34);pointer-events:none;
  }
  #sound{
    pointer-events:auto;
    width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.06);color:rgba(255,255,255,.62);
    font-size:12px;line-height:1;display:grid;place-items:center;cursor:pointer;
    padding:0;letter-spacing:0;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  #sound:active{transform:scale(.9)}
  #sound svg{display:block}
  #sound .x{display:none}
  #sound.muted .wave{display:none}
  #sound.muted .x{display:block}

  /* ---------- hint ---------- */
  #hint{
    position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 34px);z-index:4;
    text-align:center;font-size:13px;color:rgba(255,255,255,.62);
    letter-spacing:.06em;pointer-events:none;
    transition:opacity .5s ease, transform .5s ease;
  }
  #hint.hide{opacity:0;transform:translateY(8px)}

  /* ---------- game over ---------- */
  #over{
    position:fixed;inset:0;z-index:9;display:none;place-items:center;
    background:rgba(6,8,14,.74);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    padding:24px;
  }
  #over.show{display:grid;animation:fade .28s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{
    width:min(86vw,340px);text-align:center;
    background:linear-gradient(180deg,#1d2436,#121826);
    border:1px solid rgba(255,255,255,.12);
    border-radius:26px;padding:28px 24px 24px;
    box-shadow:0 30px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.07);
    animation:rise .32s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes rise{from{transform:translateY(22px) scale(.94);opacity:0}to{transform:none;opacity:1}}
  .card h2{margin:0 0 6px;font-size:21px;letter-spacing:.02em}
  .card .sub{margin:0 0 18px;font-size:12.5px;color:var(--muted)}
  .big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1;
       background:linear-gradient(180deg,#fff,#9ec3ff);-webkit-background-clip:text;background-clip:text;
       -webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums}
  .card .best{margin-top:8px;font-size:12.5px;color:var(--muted)}
  .btn{
    margin-top:22px;width:100%;border:0;border-radius:16px;padding:15px 0;
    font-size:16px;font-weight:700;letter-spacing:.06em;color:#0a1020;cursor:pointer;
    background:linear-gradient(180deg,#8fc0ff,#5d94ff);
    box-shadow:0 8px 24px rgba(80,140,255,.35), inset 0 1px 0 rgba(255,255,255,.5);
    font-family:inherit;
  }
  .btn:active{transform:translateY(1px) scale(.99)}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="score">
    <div class="lbl">SCORE</div>
    <div class="val" id="score">0</div>
  </div>
  <div class="next">
    <div class="lbl">NEXT</div>
    <img id="nextImg" alt="">
  </div>
</div>
<div id="brand"><span>合成大丑照</span><button id="sound" aria-label="声音"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M18.5 6a9 9 0 0 1 0 12"/><path class="x" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg></button></div>
<div id="hint">按住拖动 · 松手掉落</div>

<div id="over">
  <div class="card">
    <h2>堆满了！</h2>
    <p class="sub">这张脸已经把屏幕顶穿了</p>
    <div class="big" id="overScore">0</div>
    <div class="best">最高分 <span id="overBest">0</span></div>
    <button class="btn" id="again">再来一局</button>
  </div>
</div>

  var actx = null, master = null, muted = false;
  try { muted = localStorage.getItem('chou_muted') === '1'; } catch (e) { muted = false; }

  function ensureAudio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }

      try {
        master = actx.createGain();
        master.gain.value = 0.85;
        if (actx.createDynamicsCompressor) {
          var comp = actx.createDynamicsCompressor();
          comp.threshold.value = -14;
          comp.knee.value = 22;
          comp.ratio.value = 8;
          comp.attack.value = 0.003;
          comp.release.value = 0.2;
          master.connect(comp); comp.connect(actx.destination);
        } else {
          master.connect(actx.destination);

      try {

        var s = actx.createBufferSource();
        s.buffer = b; s.connect(actx.destination); s.start(0);

    if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
    return actx;
  }

  /* run a sound only once the context is really running */
  function withAudio(fn) {
    if (muted) return;
    var ac = ensureAudio();
    if (!ac) return;
    if (ac.state === 'running') { fn(ac, ac.currentTime + 0.002); return; }

  var clipBuf = {}, clipsLoaded = false;

  function loadClips(ac) {
    if (clipsLoaded) return;
    clipsLoaded = true;
    Object.keys(CLIPS).forEach(function (key) {
      var uri = CLIPS[key];
      if (!uri || typeof atob !== 'function') return;
      try {

        var bin = atob(b64);

      var f = 180 * Math.pow(1.30, lvl);            /* 180 .. 670 Hz, higher level = higher pitch */
      var v = 0.40 + lvl * 0.02;
      tone(ac, t, f * 3.6, f * 0.95, 0.20, 'sine', v);            /* downward bloop */
      tone(ac, t, f * 7.2, f * 2.4, 0.09, 'triangle', 0.13);      /* bite */
      crack(ac, t, 0.045, 0.20, 1800 + lvl * 500, 1.1);           /* transient */
      if (lvl >= 3) tone(ac, t, 90, 48, 0.26, 'sine', 0.22);      /* thump on big ones */
      tone(ac, t + 0.05, f * 4.4, f * 3.0, 0.16, 'sine', 0.07);   /* tail */
    });
  }

  function sfxDrop() {
    if (playClip('drop', 1, 0.6)) return;
    withAudio(function (ac, t) {
      tone(ac, t, 320, 190, 0.07, 'sine', 0.10);
      crack(ac, t, 0.03, 0.06, 3200, 1.6);
    });
  }

  function sfxFinal() {
    if (playClip('final', 1, 1)) return;
    withAudio(function (ac, t) {
      var notes = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < notes.length; i++) {
        tone(ac, t + i * 0.075, notes[i], notes[i] * 1.01, 0.30, 'triangle', 0.22);
      }
      tone(ac, t, 70, 40, 0.5, 'sine', 0.40);
      crack(ac, t, 0.30, 0.22, 900, 0.8);
    });
  }

  function sfxLose() {
    if (playClip('lose', 1, 1)) return;
    withAudio(function (ac, t) {
      var notes = [392, 329.63, 261.63, 196];
      for (var i = 0; i < notes.length; i++) {
        tone(ac, t + i * 0.12, notes[i], notes[i] * 0.98, 0.34, 'triangle', 0.20);
      }
    });
  }

  /* ================================================================
     sizing
     ================================================================ */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function resize() {
    var cssW = Math.max(300, window.innerWidth || 390);
    var cssH = Math.max(420, window.innerHeight || 640);
    var dpr = Math.min(window.devicePixelRatio || 1, 3);

    view.cssW = cssW; view.cssH = cssH; view.dpr = dpr;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    H = clamp(Math.round(W * cssH / cssW), 600, 960);
    view.s = Math.min(cssW / W, cssH / H);
    view.ox = (cssW - W * view.s) / 2;
    view.oy = (cssH - H * view.s) / 2;

    buildSprites();
    if (started) rebuildWalls();
  }

  /* ================================================================
     sprites â€” each level pre-rendered as a round sticker
     ================================================================ */
  function buildSprites() {
    var res = clamp(view.s * view.dpr, 1.2, 3);
    sprites = [];
    for (var i = 0; i < IMG_SRC.length; i++) {
      var r = R[i];
      var pad = r * DISP;
      var px = Math.max(24, Math.round(pad * 2 * res));
      var c = document.createElement('canvas');
      c.width = px; c.height = px;
      var g = c.getContext('2d');
      var cx = px / 2, rad = px / 2 / DISP;

      g.save();
      g.beginPath(); g.arc(cx, cx, rad, 0, TAU); g.clip();
      g.drawImage(images[i], cx - rad, cx - rad, rad * 2, rad * 2);
      var grd = g.createRadialGradient(cx, cx - rad * 0.35, rad * 0.12, cx, cx, rad * 1.02);
      grd.addColorStop(0, 'rgba(255,255,255,0.10)');
      grd.addColorStop(0.6, 'rgba(255,255,255,0)');
      grd.addColorStop(1, 'rgba(0,0,0,0.30)');
      g.fillStyle = grd; g.fillRect(0, 0, px, px);
      g.restore();

      g.beginPath(); g.arc(cx, cx, rad, 0, TAU);
      g.lineWidth = Math.max(2, rad * 0.085);
      g.strokeStyle = 'rgba(255,255,255,0.94)';
      g.stroke();

      sprites.push(c);
    }
  }

  /* ================================================================
     physics setup
     ================================================================ */
  function rebuildWalls() {
    if (walls.length) Composite.remove(engine.world, walls);
    var t = 80;
    var opt = { isStatic: true, friction: 0.55, restitution: 0.02, label: 'wall' };
    walls = [
      Bodies.rectangle(-t / 2, H / 2, t, H * 3, opt),
      Bodies.rectangle(W + t / 2, H / 2, t, H * 3, opt),
      Bodies.rectangle(W / 2, H + t / 2 - 0.5, W + t * 2, t, opt)
    ];
    Composite.add(engine.world, walls);
  }

  function setupEngine() {
    engine = M.Engine.create();
    engine.gravity.y = 1;
    engine.gravity.scale = GRAV;
    engine.positionIterations = 10;
    engine.velocityIterations = 8;
    engine.constraintIterations = 2;
    rebuildWalls();

    Events.on(engine, 'collisionStart', function (ev) {
      var pairs = ev.pairs;
      for (var i = 0; i < pairs.length; i++) {
        var a = pairs[i].bodyA, b = pairs[i].bodyB;
        if (!a || !b) continue;
        if (typeof a.lvl !== 'number' || typeof b.lvl !== 'number') continue;
        if (a.lvl !== b.lvl) continue;
        if (a.lvl >= MAXLVL) continue;              /* the biggest face never merges away */
        if (!a.alive || !b.alive || a.merging || b.merging) continue;
        a.merging = b.merging = true;
        mergeQueue.push([a, b]);
      }
    });
  }

  /* ================================================================
     pieces
     ================================================================ */
  function pickLevel() {
    var r = Math.random(), acc = 0;
    for (var i = 0; i < SPAWN_W.length; i++) {
      acc += SPAWN_W[i];
      if (r <= acc) return i;
    }
    return 0;
  }

  function addPiece(lvl, x, y, vx, vy) {
    var r = R[lvl];
    var b = Bodies.circle(x, y, r, {
      restitution: 0.05,
      friction: 0.42,
      frictionStatic: 0.65,
      frictionAir: 0.006,
      density: 0.001,
      slop: 0.02,
      label: 'piece'
    });
    b.lvl = lvl;
    b.alive = true;
    b.merging = false;
    b.born = timeNow;
    b.dangerT = 0;
    Body.setVelocity(b, { x: vx || 0, y: vy || 0 });
    Composite.add(engine.world, b);
    return b;
  }

  function removePiece(b) {
    if (!b.alive) return;
    b.alive = false;
    Composite.remove(engine.world, b);
  }

  /* ================================================================
     merging
     ================================================================ */
  function processMerges() {
    if (!mergeQueue.length) return;
    var q = mergeQueue; mergeQueue = [];
    for (var i = 0; i < q.length; i++) {
      var a = q[i][0], b = q[i][1];
      if (!a.alive || !b.alive) { a.merging = b.merging = false; continue; }
      merge(a, b);
    }
  }

  function merge(a, b) {
    var lvl = a.lvl;
    var mx = (a.position.x + b.position.x) / 2;
    var my = (a.position.y + b.position.y) / 2;
    var vx = (a.velocity.x + b.velocity.x) * 0.35;
    var vy = (a.velocity.y + b.velocity.y) * 0.35;

    removePiece(a); removePiece(b);

    var pts = (lvl + 1) * (lvl + 2) / 2;
    burst(mx, my, R[lvl] * 0.9, lvl);

    var unlocking = (lvl + 1 === MAXLVL);

    var nb = addPiece(lvl + 1, mx, my, vx, vy - 1.6);
    nb.born = timeNow;

    if (unlocking) {
      /* the final face is born â€” big moment, then the board starts filling fast */
      addScore(100, mx, my);
      sfxFinal();
      flash = 1;
      shake = Math.max(shake, 11);
      ring(mx, my, R[lvl] * 0.8, R[lvl] * 4.4, 'rgba(255,215,110,', 0.7);
      ring(mx, my, R[lvl] * 0.6, R[lvl] * 3.2, 'rgba(255,255,255,', 0.55);
      burst(mx, my, R[lvl] * 1.4, lvl);
      banner = 2.4;
      if (navigator.vibrate) { try { navigator.vibrate([16, 40, 26]); } catch (e) {} }
    } else {
      addScore(pts, mx, my);
      sfxMerge(lvl);
      ring(mx, my, R[lvl] * 0.7, R[lvl + 1] * 1.9, 'rgba(255,255,255,', 0.5);
      shake = Math.max(shake, 2 + lvl * 0.9);
      if (navigator.vibrate && lvl >= 2) { try { navigator.vibrate(12); } catch (e) {} }
    }
  }

  /* ================================================================
     fx
     ================================================================ */
  var PCOLORS = ['#ffd166', '#ff8fa3', '#8fd6ff', '#c7a8ff', '#9bffb0', '#ffffff'];

  function burst(x, y, rr, lvl) {
    var n = 10 + Math.round(rr / 8);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU;
      var sp = 1.2 + Math.random() * 4.2;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.2,
        r: 1.2 + Math.random() * (2.6 + lvl * 0.5),
        life: 0, max: 0.42 + Math.random() * 0.4,
        c: PCOLORS[(Math.random() * PCOLORS.length) | 0]
      });
    }
  }

  function ring(x, y, r0, r1, col, a) {
    rings.push({ x: x, y: y, r0: r0, r1: r1, life: 0, max: 0.42, col: col, a: a });
  }

  function addScore(pts, x, y) {
    score += pts;
    elScore.textContent = score;
    elScore.classList.remove('pop');
    void elScore.offsetWidth;
    elScore.classList.add('pop');
    setTimeout(function () { elScore.classList.remove('pop'); }, 140);
    texts.push({ x: x, y: y, t: '+' + pts, life: 0, max: 0.9 });
    if (score > best) { best = score; try { localStorage.setItem('chou_best', String(best)); } catch (e) {} }
  }

  /* ================================================================
     dropping
     ================================================================ */
  function currentRadius() { return R[cur]; }

  function drop() {
    if (over || cool > 0) return;
    var r = currentRadius();
    var x = clamp(aimX, r + 1, W - r - 1);
    addPiece(cur, x, DROP_Y, 0, 1.4);
    sfxDrop();
    cool = COOLDOWN;
    cur = nxt;
    nxt = pickLevel();
    elNext.src = IMG_SRC[nxt];
    aimX = clamp(aimX, R[cur] + 1, W - R[cur] - 1);
    if (!hintGone) { hintGone = true; elHint.classList.add('hide'); }
  }

  /* ================================================================
     game over / reset
     ================================================================ */
  function lose() {
    if (over || AUTO) return;
    over = true;
    sfxLose();
    if (score > best) { best = score; try { localStorage.setItem('chou_best', String(best)); } catch (e) {} }
    elOverScore.textContent = score;
    elOverBest.textContent = best;
    elOver.classList.add('show');
  }

  function reset() {
    var bodies = Composite.allBodies(engine.world);
    for (var i = 0; i < bodies.length; i++) if (typeof bodies[i].lvl === 'number') Composite.remove(engine.world, bodies[i]);
    mergeQueue.length = 0;
    particles.length = 0; rings.length = 0; texts.length = 0;
    score = 0; over = false; cool = 0; shake = 0; flash = 0; banner = 0;
    elScore.textContent = '0';
    elOver.classList.remove('show');
    cur = pickLevel(); nxt = pickLevel();
    elNext.src = IMG_SRC[nxt];
    aimX = W / 2;
    timeNow = performance.now();
    hintGone = false;
    elHint.classList.remove('hide');
  }

  /* ================================================================
     render
     ================================================================ */
  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, view.cssH);
    g.addColorStop(0, '#141c30');
    g.addColorStop(0.45, '#0d1322');
    g.addColorStop(1, '#080b13');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, view.cssW, view.cssH);

    /* soft glow behind the field */
    var cx = view.ox + W * view.s / 2;
    var rg = ctx.createRadialGradient(cx, view.cssH * 0.18, 10, cx, view.cssH * 0.18, view.cssH * 0.75);
    rg.addColorStop(0, 'rgba(70,120,255,0.13)');
    rg.addColorStop(1, 'rgba(70,120,255,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, view.cssW, view.cssH);

    /* vignette */
    var vg = ctx.createRadialGradient(view.cssW / 2, view.cssH * 0.5, view.cssH * 0.28,
                                      view.cssW / 2, view.cssH * 0.5, view.cssH * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, view.cssW, view.cssH);
  }

  function drawField() {
    var top = DROP_Y - 34;

    /* danger zone tint */
    var zg = ctx.createLinearGradient(0, top, 0, DANGER_Y + 26);
    zg.addColorStop(0, 'rgba(255,70,70,0.055)');
    zg.addColorStop(1, 'rgba(255,70,70,0)');
    ctx.fillStyle = zg;
    ctx.fillRect(0, top, W, DANGER_Y + 26 - top);

    /* field body tint */
    ctx.fillStyle = 'rgba(255,255,255,0.030)';
    ctx.fillRect(0, top, W, H - top);

    /* walls + ceiling */
    ctx.strokeStyle = 'rgba(255,255,255,0.11)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(1, top); ctx.lineTo(1, H);
    ctx.moveTo(W - 1, top); ctx.lineTo(W - 1, H);
    ctx.moveTo(0, top); ctx.lineTo(W, top);
    ctx.stroke();

    /* floor */
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, H - 1); ctx.lineTo(W, H - 1); ctx.stroke();

    /* danger line */
    var dg = 0;
    var bs = Composite.allBodies(engine.world);
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (typeof b.lvl !== 'number' || !b.alive) continue;
      if (b.dangerT > 0) dg = Math.max(dg, b.dangerT / WARN_SEC);
    }
    var pulse = 0.5 + 0.5 * Math.sin(timeNow / 130);
    ctx.save();
    ctx.setLineDash([9, 9]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = dg > 0
      ? 'rgba(255,70,70,' + (0.45 + 0.5 * Math.max(dg, pulse * 0.6)) + ')'
      : 'rgba(255,110,110,0.28)';
    ctx.beginPath();
    ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y);
    ctx.stroke();
    ctx.restore();
  }

  function drawPiece(lvl, x, y, ang, scale, alpha) {
    var r = R[lvl];
    var d = 2 * r * DISP * scale;
    if (x + d < -20 || x - d > W + 20 || y + d < -20 || y - d > H + 20) return;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.translate(x, y);
    if (ang) ctx.rotate(ang);
    ctx.drawImage(sprites[lvl], -d / 2, -d / 2, d, d);
    ctx.restore();
  }

  function drawBodies() {
    var bs = Composite.allBodies(engine.world);
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (typeof b.lvl !== 'number' || !b.alive) continue;
      var sc = 1;
      var t = (timeNow - b.born) / 150;
      if (t < 1) {
        var k = t < 0 ? 0 : t;
        var ob = 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);   /* easeOutBack-ish */
        sc = 0.62 + 0.38 * ob;
        if (sc < 0.5) sc = 0.5;
      }
      drawPiece(b.lvl, b.position.x, b.position.y, b.angle, sc, 1);
    }
  }

  function drawAim() {
    if (over) return;
    var r = R[cur];
    var x = clamp(aimX, r + 1, W - r - 1);

    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 9]);
    ctx.beginPath();
    ctx.moveTo(x, DROP_Y + r * 0.9);
    ctx.lineTo(x, H - 6);
    ctx.stroke();
    ctx.restore();

    if (cool > 0) return;
    var bob = Math.sin(timeNow / 320) * 1.6;
    drawPiece(cur, x, DROP_Y + bob, 0, 1, 0.92);
  }

  function drawFx() {
    var i, p;
    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      var k = 1 - p.life / p.max;
      ctx.globalAlpha = Math.max(0, k);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.4 + 0.6 * k), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < rings.length; i++) {
      var g = rings[i];
      var t = g.life / g.max;
      var rr = g.r0 + (g.r1 - g.r0) * (1 - Math.pow(1 - t, 2.4));
      ctx.strokeStyle = g.col + (g.a * (1 - t)) + ')';
      ctx.lineWidth = 2 + 4 * (1 - t);
      ctx.beginPath(); ctx.arc(g.x, g.y, rr, 0, TAU); ctx.stroke();
    }

    for (i = 0; i < texts.length; i++) {
      var s = texts[i];
      var tt = s.life / s.max;
      ctx.globalAlpha = Math.max(0, 1 - tt * tt);
      ctx.fillStyle = '#ffe08a';
      ctx.font = '800 20px system-ui,-apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 6;
      ctx.fillText(s.t, s.x, s.y - 26 - tt * 34);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  function drawBanner() {
    if (banner <= 0) return;
    var a = banner > 2.1 ? (2.4 - banner) / 0.3 : Math.min(1, banner / 0.6);
    var sc = 1 + 0.05 * Math.sin(timeNow / 200);
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, a));
    ctx.translate(W / 2, H * 0.36);
    ctx.scale(sc, sc);
    ctx.textAlign = 'center';
    ctx.font = '900 30px system-ui,-apple-system,\"PingFang SC\",sans-serif';
    ctx.fillStyle = '#ffe08a';
    ctx.shadowColor = 'rgba(255,180,60,.85)'; ctx.shadowBlur = 26;
    ctx.fillText('终极丑照 · 解锁', 0, 0);
    ctx.font = '700 13px system-ui,-apple-system,sans-serif';
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.fillText('这张脸一出来，你就快完了', 0, 27);
    ctx.restore();
  }

  function render() {
    var s = view.s, dpr = view.dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();

    var sx = 0, sy = 0;
    if (shake > 0.2) {
      sx = (Math.random() - 0.5) * shake;
      sy = (Math.random() - 0.5) * shake;
    }

    ctx.save();
    ctx.translate(view.ox + sx, view.oy + sy);
    ctx.scale(s, s);

    drawField();
    drawAim();
    drawBodies();
    drawFx();
    drawBanner();

    ctx.restore();

    if (flash > 0.01) {
      ctx.fillStyle = 'rgba(255,245,210,' + (flash * 0.55) + ')';
      ctx.fillRect(0, 0, view.cssW, view.cssH);
    }
  }

  /* ================================================================
     update
     ================================================================ */
  function stepPhysics(dtms) {
    M.Engine.update(engine, dtms);
    processMerges();
  }

  function update(dt) {
    timeNow = performance.now();

    if (cool > 0) cool = Math.max(0, cool - dt);
    if (shake > 0) shake = Math.max(0, shake - dt * 42);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.6);
    if (banner > 0) banner = Math.max(0, banner - dt);

    /* particles */
    var i, p;
    for (i = particles.length - 1; i >= 0; i--) {
      p = particles[i];
      p.life += dt;
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      p.vy += 26 * dt;
      p.vx *= 0.985;
      p.x += p.vx; p.y += p.vy;
    }
    for (i = rings.length - 1; i >= 0; i--) {
      rings[i].life += dt;
      if (rings[i].life >= rings[i].max) rings.splice(i, 1);
    }
    for (i = texts.length - 1; i >= 0; i--) {
      texts[i].life += dt;
      if (texts[i].life >= texts[i].max) texts.splice(i, 1);
    }

    if (over) return;

    /* danger timer */
    var bs = Composite.allBodies(engine.world);
    var dying = false;
    for (i = 0; i < bs.length; i++) {
      var b = bs[i];
      if (typeof b.lvl !== 'number' || !b.alive) continue;
      var speed = Math.sqrt(b.velocity.x * b.velocity.x + b.velocity.y * b.velocity.y);
      var settled = speed < 0.55;
      var above = (b.position.y - R[b.lvl]) < DANGER_Y;
      var old = (timeNow - b.born) > 700;
      if (above && settled && old) {
        b.dangerT += dt;
        if (b.dangerT > WARN_SEC) dying = true;
      } else if (b.dangerT > 0) {
        b.dangerT = Math.max(0, b.dangerT - dt * 1.6);
      }
    }
    if (dying) lose();
  }

  /* ================================================================
     input
     ================================================================ */
  function toWorldX(clientX) {
    var rect = canvas.getBoundingClientRect();
    return ((clientX - rect.left) - view.ox) / view.s;
  }

  function pointerDown(e) {
    ensureAudio();
    dragging = true;
    aimX = toWorldX(e.clientX);
    if (e.cancelable) e.preventDefault();
  }

  function pointerMove(e) {
    if (!dragging) return;
    aimX = toWorldX(e.clientX);
    if (e.cancelable) e.preventDefault();
  }

  function pointerUp(e) {
    if (!dragging) return;
    dragging = false;
    aimX = toWorldX(e.clientX);
    drop();
    if (e.cancelable) e.preventDefault();
  }

  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', pointerDown, { passive: false });
    canvas.addEventListener('pointermove', pointerMove, { passive: false });
    canvas.addEventListener('pointerup', pointerUp, { passive: false });
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  } else {
    canvas.addEventListener('touchstart', function (e) { pointerDown(e.touches[0]); }, { passive: false });
    canvas.addEventListener('touchmove', function (e) { pointerMove(e.touches[0]); }, { passive: false });
    canvas.addEventListener('touchend', function (e) { pointerUp(e.changedTouches[0]); }, { passive: false });
  }

  /* desktop keyboard */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { aimX = clamp(aimX - 14, 0, W); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { aimX = clamp(aimX + 14, 0, W); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'ArrowDown') { drop(); e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R') { reset(); }
  });

  function setSoundIcon() {
    elSound.classList.toggle('muted', muted);
    elSound.setAttribute('aria-label', muted ? '开启声音' : '关闭声音');
  }

  elAgain.addEventListener('click', function (e) { e.stopPropagation(); reset(); });
  elSound.addEventListener('click', function (e) {
    e.stopPropagation();
    muted = !muted;
    setSoundIcon();
    try { localStorage.setItem('chou_muted', muted ? '1' : '0'); } catch (err) {}
    if (!muted) { ensureAudio(); sfxMerge(1); }
  });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ================================================================
     loop
     ================================================================ */
  var last = 0, acc = 0;

  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(64, now - last);
    last = now;

    if (!over) {
      acc += dt;
      var guard = 0;
      while (acc >= 16.6667 && guard < 4) {
        stepPhysics(16.6667);
        acc -= 16.6667;
        guard++;
      }
      if (guard >= 4) acc = 0;
    }

    update(dt / 1000);
    render();
    requestAnimationFrame(frame);
  }

  /* ================================================================
     boot
     ================================================================ */
  function loadImages(cb) {
    var left = IMG_SRC.length, ok = false;
    IMG_SRC.forEach(function (src, i) {
      var im = new Image();
      im.onload = function () {
        images[i] = im;
        if (--left === 0 && !ok) { ok = true; cb(); }
      };
      im.onerror = function () {
        if (--left === 0 && !ok) { ok = true; cb(); }
      };
      im.src = src;
    });
  }

  function boot() {
    resize();
    setupEngine();
    reset();
    started = true;
    rebuildWalls();

    window.addEventListener('resize', function () { resize(); });
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { resize(); }, 260);
    });
    document.addEventListener('visibilitychange', function () {
      last = 0; acc = 0;
      if (!document.hidden && actx && actx.state === 'suspended') {
        try { actx.resume(); } catch (e) {}
      }
    });

    setSoundIcon();

    if (AUTO) {
      setInterval(function () {
        if (cool <= 0 && !over) {
          aimX = R[cur] + Math.random() * (W - 2 * R[cur]);
          drop();
        }
      }, 300);
    }

    requestAnimationFrame(frame);
  }

  /* ---------- test hook (no effect in production) ---------- */
  if (window.__SUIKA_TEST__) {
    window.__suika = {
      R: R, W: W, DISP: DISP,
      H: function () { return H; },
      DANGER_Y: DANGER_Y, DROP_Y: DROP_Y,
      aim: function (x) { aimX = x; },
      drop: drop,
      reset: reset,
      bodies: function () {
        return Composite.allBodies(engine.world)
          .filter(function (b) { return typeof b.lvl === 'number' && b.alive; })
          .map(function (b) {
            var sc = 1, t = (timeNow - b.born) / 150;
            if (t < 1) { var k = t < 0 ? 0 : t; sc = 0.62 + 0.38 * (1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2)); }
            return { lvl: b.lvl, x: b.position.x, y: b.position.y, a: b.angle, s: sc };
          });
      },
      state: function () {
        return { score: score, over: over, cur: cur, nxt: nxt, cool: cool, aimX: aimX };
      }
    };
  }

  loadImages(boot);
})();
</script>
</body>
</html>
